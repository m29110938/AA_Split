<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-primary">💰 AA 分帳小幫手</h2>
        <button id="clearAllBtn" class="btn btn-outline-danger btn-sm">重置</button>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-bold">👥 參與人員</div>
        <div class="card-body">
            <form id="addPersonForm" class="input-group mb-3">
                <input type="text" id="personName" class="form-control" placeholder="輸入姓名並按新增" required />
                <button type="submit" class="btn btn-primary">新增</button>
            </form>
            <div id="peopleList" class="d-flex flex-wrap gap-2"></div>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-white fw-bold">✍️ 新增帳目</div>
        <div class="card-body">
            <form id="addBillForm">
                <div class="mb-3">
                    <label class="form-label text-muted small">消費用途</label>
                    <input type="text" id="purpose" class="form-control" placeholder="例如：午餐、車資" required />
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small">金額</label>
                    <input type="number" step="any" id="amount" class="form-control" placeholder="0.00" required />
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small d-block">誰付的錢？</label>
                    <div id="payerGroup" class="d-flex flex-wrap gap-2"></div>
                </div>
                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label text-muted small mb-0">包含哪些人？</label>
                        <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" onclick="selectAllIncluded(true)">全選</button>
                    </div>
                    <div id="includedGroup" class="d-flex flex-wrap gap-2"></div>
                </div>
                <button type="submit" class="btn btn-success w-100 btn-lg">新增帳目</button>
            </form>
        </div>
    </div>

    <div id="resultSection">...</div>
</div>
