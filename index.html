<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AA 分帳小幫手</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --primary-color: #0d6efd; }
    body { background-color: #f8f9fa; padding-bottom: 50px; }
    .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
    .card-header { background-color: #fff; border-bottom: 1px solid #eee; font-weight: bold; border-radius: 12px 12px 0 0 !important; }
    .btn-check:checked + .btn-outline-primary { background-color: var(--primary-color); color: white; }
    .list-group-item { border-left: none; border-right: none; }
    .delete-btn { color: #dc3545; cursor: pointer; padding: 5px 10px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 mb-0 text-primary">💰 AA 分帳小幫手</h2>
        <button id="clearAllBtn" class="btn btn-outline-danger btn-sm">重置</button>
    </div>

    <!-- 1. 人員管理 -->
    <div class="card">
      <div class="card-header">👥 參與人員</div>
      <div class="card-body">
        <form id="addPersonForm" class="input-group mb-3">
          <input type="text" id="personName" class="form-control" placeholder="輸入姓名" required />
          <button type="submit" class="btn btn-primary">新增</button>
        </form>
        <div id="peopleList" class="d-flex flex-wrap gap-2"></div>
      </div>
    </div>

    <!-- 2. 新增帳目 -->
    <div class="card">
      <div class="card-header">✍️ 新增帳目</div>
      <div class="card-body">
        <form id="addBillForm">
          <div class="mb-3">
            <label class="form-label text-muted small">消費用途</label>
            <input type="text" id="purpose" class="form-control form-control-lg" placeholder="例如：午餐、車資" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small">金額</label>
            <!-- inputmode="decimal" 確保手機彈出數字鍵盤 -->
            <input type="text" inputmode="decimal" id="amount" class="form-control form-control-lg" placeholder="0.00" required />
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small">誰付的錢？</label>
            <div id="payerGroup" class="d-flex flex-wrap gap-2"></div>
          </div>
          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label text-muted small mb-0">包含哪些人？</label>
                <div>
                    <button type="button" class="btn btn-sm btn-link p-0 text-decoration-none" onclick="selectAllIncluded(true)">全選</button>
                </div>
            </div>
            <div id="includedGroup" class="d-flex flex-wrap gap-2"></div>
          </div>
          <button type="submit" class="btn btn-success w-100 btn-lg shadow-sm">新增帳目</button>
        </form>
      </div>
    </div>

    <!-- 3. 還款建議 (最重要，移到中間) -->
    <div class="card border-primary shadow">
      <div class="card-header bg-primary text-white">📋 最終結算建議</div>
      <div class="card-body p-0">
        <ul id="settlementList" class="list-group list-group-flush"></ul>
        <div class="p-3">
            <button id="copyBtn" class="btn btn-dark w-100">📋 複製結果傳到 LINE</button>
        </div>
      </div>
    </div>

    <!-- 4. 帳目紀錄 -->
    <div class="card">
      <div class="card-header">📜 帳目明細</div>
      <div class="card-body p-0">
        <ul id="billsList" class="list-group list-group-flush"></ul>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
